plugins {
    id "com.android.application"
}

android {
    namespace "com.lordofrobots.lorcoretest"
    compileSdk 36

    defaultConfig {
        applicationId "com.lordofrobots.lorcoretest"
        minSdk 26
        targetSdk 36
        versionCode 1
        versionName "0.1.0"
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation "com.github.mik3y:usb-serial-for-android:3.10.0"
}
