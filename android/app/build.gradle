plugins {
    id "com.android.application"
}

android {
    namespace "com.lordofrobots.lorcoretest"
    compileSdk 36

    defaultConfig {
        applicationId "com.lordofrobots.lorcoretest"
        minSdk 26
        targetSdk 36
        versionCode 10000
        versionName "1.0.0"

        ndk {
            abiFilters "arm64-v8a", "armeabi-v7a"
        }

        externalNativeBuild {
            cmake {
                cppFlags "-std=c++17"
                arguments "-DANDROID_STL=c++_static"
            }
        }
    }

    ndkVersion "27.3.13750724"

    externalNativeBuild {
        cmake {
            path file("src/main/cpp/CMakeLists.txt")
            version "3.22.1"
        }
    }

    buildFeatures {
        buildConfig true
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

}

dependencies {
    implementation "com.github.mik3y:usb-serial-for-android:3.10.0"
}
